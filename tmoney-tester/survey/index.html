<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>교통카드 개인 맞춤 추천 서비스</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"/>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
  <div class="container">
    <section class="page-layer">
      <header>
        <a class="back-btn"></a>
        <h1>교통카드 추천</h1>
      </header>
      <div class="wrapper">
        <div class="title-area">
          <h1>
            <b>내게 맞는 교통카드</b>를 찾아볼까요?
          </h1>
          <p>
            수도권(서울, 경기, 인천) 지역만<br/>
            맞춤 교통카드 추천 서비스가 제공됩니다.
          </p>
        </div>
        <div class="activity-area">
          <div class="radio-text-box">
            <input name="card" id="tm_card" type="radio" value="tm" checked />
            <label for="tm_card">
              <img alt="bulb" src="../img/icon-bulb.png" />
              <b class="title">교통카드 번호를 알고 있어요</b>
              <span>
                티머니 교통카드 번호를 입력하면 교통내역 데이터 기준으로
                나에게 딱! 맞는 교통카드를 추천받을 수 있어요
              </span>
            </label>
          </div>
          <div class="radio-text-box">
            <input name="card" id="cd_card" type="radio" value="cd" />
            <label for="cd_card">
              <img alt="submit" src="../img/icon-submit.png" />
              <span>
                  <b class="title">직접 정보를 입력할래요</b>
                  교통카드 번호 없이도 이용금액, 횟수 등의 정보를 직접 입력하여 교통카드를 추천받을 수 있어요
                </span>
            </label>
          </div>
          <a href="#" class="line-text">교통카드 번호 확인방법</a>
        </div>
      </div>
      <button class="next">다음</button>
    </section>
    <div class="popup-layer">
      <div class="popup-container">
        <h4>
          교통카드 번호 확인방법
          <a class="close-btn" href="#">
            <span></span>
            <span></span>
          </a>
        </h4>
        <div class="contents">
          <h6>모바일티머니 교통카드 이용고객</h6>
          <p>모바일티머니 앱 > 메뉴(三) > 교통카드 > 교통카드 번호(16자리) 확인</p>
        </div>
        <div class="contents">
          <h6>삼성월렛 티머니 교통카드 이용고객</h6>
          <p>삼성월렛 앱 > ‘전체’ 메뉴 > 교통카드 > 등록된 ‘티머니 교통카드’ 선택 > 교통카드 번호(16자리 확인)</p>
        </div>
      </div>
    </div>
  </div>
  <script>

    const popButtons = document.querySelectorAll('.line-text')
    for (const popButton of popButtons) {
      popButton.addEventListener('click', function () {
        document.querySelector('.popup-layer').classList.add('active');
      });
    }
    //닫기 버튼을 눌렀을 때 모달팝업이 닫힘
    document.querySelector('.popup-layer .close-btn').addEventListener('click', function () {
      //'active' class 제거
      document.querySelector('.popup-layer').classList.remove('active');
    })

    // 사용중인 교통카드 section
    document.querySelector('.page-layer .back-btn').addEventListener('click', function() {
      history.back();
    });
    document.querySelector('.page-layer .next').addEventListener('click', function() {
      const selectedType = document.querySelector('input[name="card"]:checked');
      const value = selectedType.value;

      if (value === 'tm') {
        location.href=("./index-case01.html");
        // 이용내역 자동조회 클릭 시 카드번호 입력 section으로 이동
      } else {
        location.href=("./index-case02.html");
        // 직접입력 선택 시 case2로 이동
      }
    });
  </script>
</body>
</html>
